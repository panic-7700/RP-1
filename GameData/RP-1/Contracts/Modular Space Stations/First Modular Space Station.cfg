CONTRACT_TYPE
{
	name = first_modular_spaceStation
	title = Modular Space Station Core
	group = ModularEarthSpaceStation
	agent = Stations

	description = <b>Program: Modular Earth Space Station<br>Type: <color=green>Required</color></b><br><br>Design, build, and launch a new habitation module into Earth orbit. Your core module should support at least 3 crew, and must be continuously occupied for 75 days.

	synopsis = Build a new orbital habitat and crew it for at least 75 days

	completedMessage = Congratulations! You have started a new era of long-term human habitation in space!

	sortKey = 1500

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************
	
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 500
	rewardFunds =  0
	failureReputation = 0 // was @rewardReputation
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ModularEarthSpaceStation
	}
	// ************ PARAMETERS ************
	
	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Put a new habitation module into orbit
		notes = The core must have space for at least 3 crew and include storage for at least 75 days of research payload
		define = modularSpaceStation
		disableOnStateChange = true
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new habitation module
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCapacity
			type = HasCrewCapacity
			minCapacity = 3
			title = Have space for at least 3 crew
			hideChildren = true
			disableOnStateChange = false
		}
		PARAMETER
		{
		    name = DockingPort
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 2
			title = Have at least 2 docking ports
			hideChildren = true
		}	
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 250000
			maxApA = 500000
			targetBody = HomeWorld()
			title = Reach orbit with a perigee greater than 250 km and an apogee less than 500 km
			hideChildren = true
		}
	}
	PARAMETER
	{
		name = stayOnStation
		type = VesselParameterGroup
		title = Keep at least 3 crew aboard the station for 75 days.
		vessel = modularSpaceStation
		notes = You can work on other contracts while your crew are working. You are safe to return to Mission Control
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = HasCrew
			type  = HasCrew
			minCrew = 3
			title = Has at least 3 crew members on the station.
			hideChildren = true
		}	
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 250000
			maxApA = 500000
			targetBody = HomeWorld()
			disableOnStateChange = false
			title = Remain in a stable orbit
		}
		PARAMETER
		{
			name = Multi-Year Habitation Analysis
			type = RP1CollectScience
			title = Conduct Multi-Year Habitation Analysis for 75d
			notes = This experiment requires 750 units of Research Payload every 30d //Placeholder value.
			targetBody = HomeWorld()
			situation = InSpaceLow
			experiment = RP0longDurationHabit3
			fractionComplete = 0.02054794521 // 75/3650
		}
	}
}
